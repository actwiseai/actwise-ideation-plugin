name: Verify CLI installations

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_REPOSITORY: actwiseai/actwise-ideation-plugin
  MCP_URL: https://actwise.ai/ideation/mcp/v1

jobs:
  repository:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.6.1
      - name: Validate manifests and repository safety
        run: npm test

  codex:
    name: Codex CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.6.1
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0
      - name: Install from the Actwise marketplace
        run: |
          codex plugin marketplace add "$PLUGIN_REPOSITORY" --json | tee /tmp/codex-marketplace.json
          codex plugin list --available --json | tee /tmp/codex-available.json
          jq -e '.available[] | select(.name == "actwise-ideation" and .marketplaceName == "actwise")' /tmp/codex-available.json
          codex plugin add actwise-ideation@actwise --json | tee /tmp/codex-install.json
      - name: Verify the installed skill and MCP server
        run: |
          codex plugin list --json | tee /tmp/codex-installed.json
          jq -e '.installed[] | select(.name == "actwise-ideation" and .enabled == true)' /tmp/codex-installed.json
          installed_path="$(jq -r '.installedPath' /tmp/codex-install.json)"
          test -f "$installed_path/skills/actwise-ideation/SKILL.md"
          test -f "$installed_path/.mcp.json"
          jq -e --arg url "$MCP_URL" '.mcpServers["actwise-ideation"].url == $url' "$installed_path/.mcp.json"

  claude:
    name: Claude Code CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.6.1
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.232
      - name: Validate and install from GitHub
        run: |
          claude plugin validate . --strict
          claude plugin marketplace add "$PLUGIN_REPOSITORY"
          claude plugin install actwise-ideation@actwise
          claude plugin list --json | tee /tmp/claude-installed.json
          claude plugin details actwise-ideation@actwise | tee /tmp/claude-details.txt
      - name: Verify the installed skill and MCP server
        run: |
          jq -e '.[] | select((.id == "actwise-ideation@actwise" or .name == "actwise-ideation") and .enabled == true)' /tmp/claude-installed.json
          installed_path="$(find "$HOME/.claude/plugins/cache" -type f -path '*/actwise-ideation/*/.mcp.json' -printf '%h\n' | head -n 1)"
          test -n "$installed_path"
          test -f "$installed_path/skills/actwise-ideation/SKILL.md"
          jq -e --arg url "$MCP_URL" '.mcpServers["actwise-ideation"].url == $url' "$installed_path/.mcp.json"
          grep -F 'actwise-ideation' /tmp/claude-details.txt

  grok:
    name: Grok Build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Grok Build CLI
        run: |
          GROK_BIN_DIR="$RUNNER_TEMP/grok-bin" bash <(curl -fsSL https://x.ai/cli/install.sh) 1.0.3
          echo "$RUNNER_TEMP/grok-bin" >> "$GITHUB_PATH"
      - name: Validate and install from GitHub
        run: |
          grok plugin validate .
          grok plugin install "$PLUGIN_REPOSITORY" --trust
          grok plugin list --json | tee /tmp/grok-installed.json
          grok plugin details actwise-ideation | tee /tmp/grok-details.txt
          grok inspect --json | tee /tmp/grok-inspect.json
      - name: Verify the installed skill and MCP server
        run: |
          grep -F 'actwise-ideation' /tmp/grok-details.txt
          installed_path="$(find "$HOME/.grok" -type f -path '*/actwise-ideation*/.mcp.json' -printf '%h\n' | head -n 1)"
          test -n "$installed_path"
          test -f "$installed_path/skills/actwise-ideation/SKILL.md"
          jq -e --arg url "$MCP_URL" '.mcpServers["actwise-ideation"].url == $url' "$installed_path/.mcp.json"

  cursor:
    name: Cursor CLI
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.6.1
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agent" --version
      - name: Install from GitHub
        run: npx --yes plugins@1.3.4 add "$PLUGIN_REPOSITORY" --target cursor --scope user --yes --debug
      - name: Verify the installed skill and MCP server
        run: |
          installed_path="$(find "$HOME/.cursor/plugins/cache" -type f -path '*/actwise-ideation*/.mcp.json' -printf '%h\n' | head -n 1)"
          test -n "$installed_path"
          test -f "$installed_path/skills/actwise-ideation/SKILL.md"
          jq -e --arg url "$MCP_URL" '.mcpServers["actwise-ideation"].url == $url' "$installed_path/.mcp.json"

  portable:
    name: Agent Plugins CLI
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.6.1
      - name: Install a target client
        run: npm install --global @openai/codex@0.147.0
      - name: Install from GitHub
        run: npx --yes plugins@1.3.4 add "$PLUGIN_REPOSITORY" --target codex --scope user --yes --debug
      - name: Verify the installed skill and MCP server
        run: |
          installed_path="$(find "$HOME/.codex/plugins/cache" -type f -path '*/actwise-ideation/*/.mcp.json' -printf '%h\n' | head -n 1)"
          test -n "$installed_path"
          test -f "$installed_path/skills/actwise-ideation/SKILL.md"
          jq -e --arg url "$MCP_URL" '.mcpServers["actwise-ideation"].url == $url' "$installed_path/.mcp.json"

  gate:
    name: CLI Installation Gate
    if: always()
    needs:
      - repository
      - codex
      - claude
      - grok
      - cursor
      - portable
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        run: |
          test "${{ needs.repository.result }}" = "success"
          test "${{ needs.codex.result }}" = "success"
          test "${{ needs.claude.result }}" = "success"
          test "${{ needs.grok.result }}" = "success"
          test "${{ needs.cursor.result }}" = "success"
          test "${{ needs.portable.result }}" = "success"
